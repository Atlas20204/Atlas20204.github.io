<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    .wrap{text-align:center;padding:40px}
    .icon{font-size:64px;margin-bottom:24px;animation:bob 3s ease-in-out infinite}
    h1{font-size:22px;font-weight:600;letter-spacing:-0.5px;margin-bottom:8px}
    p{font-size:14px;color:#666;line-height:1.6}
    .bar{width:200px;height:3px;background:#1a1a1a;border-radius:2px;margin:28px auto 0;overflow:hidden}
    .bar span{display:block;height:100%;width:40%;background:#0a66c2;border-radius:2px;animation:slide 1.8s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🚧</div>
    <h1>Under Construction</h1>
    <p>Something's being built.<br>Check back soon.</p>
    <div class="bar"><span></span></div>
  </div>
</body>
</html>
